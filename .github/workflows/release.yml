name: Release

# Publishing a GitHub release builds every binary and pushes the matching
# version to npm. Both jobs are independent: a broken binary build does not
# block the npm publish, and vice versa.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  binary:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-15, target: darwin-arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # UPX 5.x specifically: the distro's 4.x cannot parse the ELF that postject
      # rewrites. Not every arch ships a tarball, so a miss just means "no UPX".
      - name: Install UPX
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            choco install upx -y --no-progress || true
          else
            case "$(uname -m)" in
              x86_64) u=amd64 ;;
              aarch64|arm64) u=arm64 ;;
            esac
            # Pipe straight into grep -m1 and curl dies of SIGPIPE under pipefail.
            curl -fsSL -o /tmp/upx.json https://api.github.com/repos/upx/upx/releases/latest
            tag=$(grep -m1 '"tag_name"' /tmp/upx.json | cut -d'"' -f4)
            url="https://github.com/upx/upx/releases/download/${tag}/upx-${tag#v}-${u}_linux.tar.bz2"
            curl -fsSL -o /tmp/upx.tar.bz2 "$url" && tar -xjf /tmp/upx.tar.bz2 -C /tmp &&
              sudo install -m755 "/tmp/upx-${tag#v}-${u}_linux/upx" /usr/local/bin/upx || true
          fi
          upx --version 2>/dev/null | sed -n 1p || echo "upx unavailable, building uncompressed"
      # Node SEA blobs are platform bound, so each target builds on its own OS.
      # UPX turns the ~90 MB node image into ~30 MB; see scripts/build-sea.mjs.
      - run: npm run build:sea
        env:
          MIRRORHUB_UPX: "1"
      - name: Smoke test and package
        shell: bash
        run: |
          exe="build/mirrorhub-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then exe="$exe.exe"; fi
          "$exe" version
          mkdir -p out
          size=$(stat -c%s "$exe" 2>/dev/null || stat -f%z "$exe")
          if [ "$size" -gt 60000000 ]; then
            # UPX cannot pack Mach-O, and may fail on a postject'd ELF: anything
            # still ~100 MB ships as an archive instead of a bare download.
            tar -czf "out/mirrorhub-${{ matrix.target }}.tar.gz" -C build "$(basename "$exe")"
          else
            cp "$exe" out/
          fi
          ls -l out
      - uses: actions/upload-artifact@v5
        with:
          name: mirrorhub-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: out/*

  npm:
    name: npm (@mirrorhub/cli)
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Publish
        # A manual dispatch must not burn a version; only releases publish.
        if: github.event_name == 'release' && env.HAS_NPM_TOKEN == 'true'
        run: npm publish --access public --provenance
      - name: Missing NPM_TOKEN
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::warning::NPM_TOKEN secret is not set, skipping npm publish"
